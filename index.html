<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>無料チャット　Ver.てすと</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<h1>Aki Chat Rooms</h1>

<!-- モード選択 -->
<div id="mode-screen">
  <button id="btn-create">部屋を作成</button>
  <button id="btn-join">部屋に入室</button>
</div>

<!-- 作成画面 -->
<div id="create-screen" class="hidden">
  <h2>新しい部屋を作成</h2>
  <input id="create-room" placeholder="合言葉（部屋名）を入力"><br><br>
  <button id="btn-enter-created">作成して入室</button>
</div>

<!-- 入室画面 -->
<div id="join-screen" class="hidden">
  <h2>部屋に入室</h2>
  <input id="join-room" placeholder="合言葉（部屋名）を入力"><br><br>
  <button id="btn-enter-joined">入室する</button>
</div>

<!-- チャット画面 -->
<div id="chat-screen" class="hidden">
  <h2 id="room-title"></h2>
  <div id="log"></div>
  <br>
  <input id="name" placeholder="名前"><br><br>
  <input id="text" placeholder="メッセージ" style="width:300px;">
  <button id="btn-send">送信</button>
</div>

<script src="script.js"></script>
</body>
</html>
